name: Docker Compose CI/CD

on:
  push:
    branches:
      - master

# Never interrupt an active production deployment or deploy twice at once.
concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Test deployment safety
        run: |
          bash -n scripts/deploy.sh
          node --test scripts/*.test.mjs

      - name: Create .env from DOTENV secret
        env:
          DOTENV: ${{ secrets.DOTENV }}
        run: |
          if [ -z "$DOTENV" ]; then
            echo "GitHub secret DOTENV is empty or missing"
            exit 1
          fi

          printf '%s\n' "$DOTENV" > .env
          chmod 600 .env

      - name: Validate Docker Compose config
        run: docker compose config --quiet

      - name: Prepare deploy bundle
        run: |
          mkdir -p deploy
          rsync -a --delete \
            --exclude 'node_modules' \
            --exclude '.git' \
            --exclude '.github' \
            --exclude '.nuxt' \
            --exclude '.output' \
            --exclude 'dist' \
            --exclude '*.log' \
            docker-compose.yml nginx.conf nginx.http.conf nginx.host.conf certbot front tg_bot scripts .env deploy/

      - name: Verify deploy bundle permissions
        run: |
          test -s deploy/.env
          test -r deploy/.env
          tar -cf /dev/null deploy

      - name: Download Docker base images for server build
        run: |
          set -euo pipefail

          images=(
            "node:20-alpine"
            "node:18-alpine"
            "nginx:stable-alpine"
            "certbot/certbot:latest"
          )

          for image in "${images[@]}"; do
            docker pull "$image"
          done

          docker image save "${images[@]}" | gzip -1 > deploy/docker-base-images.tar.gz
          ls -lh deploy/docker-base-images.tar.gz

      - name: Prepare app directory on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          timeout: 120s
          command_timeout: 10m
          script: |
            mkdir -p /home/${{ secrets.SERVER_USER }}/app
            sudo chown -R ${{ secrets.SERVER_USER }}:${{ secrets.SERVER_USER }} /home/${{ secrets.SERVER_USER }}/app

      - name: Copy deploy bundle to server
        # v1 is a composite action: tar runs as the runner user who owns the
        # mode-600 .env. The old Docker action used a different filesystem user.
        uses: appleboy/scp-action@ff85246acaad7bdce478db94a363cd2bf7c90345 # v1.0.0
        with:
          version: "1.8.0"
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "deploy"
          target: "/home/${{ secrets.SERVER_USER }}/app"
          overwrite: true
          strip_components: 1
          timeout: 120s
          command_timeout: 20m

      - name: Build and replace services on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          timeout: 120s
          command_timeout: 30m
          script_stop: true
          script: |
            set -euo pipefail
            cd /home/${{ secrets.SERVER_USER }}/app
            bash scripts/deploy.sh
