name: Docker Compose CI/CD

on:
  push:
    branches:
      - master

# Never interrupt an active production deployment or deploy twice at once.
concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  frontend-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: front
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: front/package-lock.json
      - name: Install test dependencies
        run: |
          npm ci --legacy-peer-deps --no-audit --no-fund
          npm ci --prefix ../tg_bot --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Test and generate the static site
        run: |
          npm test
          npm run generate
          npm run test:forms
      - name: Check nginx delivery
        working-directory: .
        run: |
          docker run -d --rm --name energo-front-check -p 127.0.0.1:4173:5173 \
            -v "$GITHUB_WORKSPACE/front/.output/public:/usr/share/nginx/html:ro" \
            -v "$GITHUB_WORKSPACE/front/nginx.conf:/etc/nginx/conf.d/default.conf:ro" \
            nginx:stable-alpine
          for attempt in 1 2 3 4 5; do
            if curl -fsS http://127.0.0.1:4173/ -o /dev/null; then break; fi
            sleep 1
          done
          node scripts/check-static-delivery.mjs http://127.0.0.1:4173
      - name: Stop test nginx
        if: always()
        run: docker rm -f energo-front-check || true

  deploy:
    needs: frontend-checks
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Test deployment safety
        run: |
          bash -n scripts/deploy.sh scripts/upload-deploy.sh
          node --test scripts/*.test.mjs

      - name: Create .env from DOTENV secret
        env:
          DOTENV: ${{ secrets.DOTENV }}
          SMTP_LANDING_ENV: ${{ secrets.SMTP_LANDING_ENV }}
        run: |
          if [ -z "$DOTENV" ]; then
            echo "GitHub secret DOTENV is empty or missing"
            exit 1
          fi

          printf '%s\n' "$DOTENV" > .env
          if [ -n "${SMTP_LANDING_ENV:-}" ]; then
            printf '%s\n' "$SMTP_LANDING_ENV" >> .env
          fi
          chmod 600 .env

      - name: Validate Docker Compose config
        run: docker compose config --quiet

      - name: Prepare deploy bundle
        run: |
          mkdir -p deploy
          rsync -a --delete \
            --exclude 'node_modules' \
            --exclude '.git' \
            --exclude '.github' \
            --exclude '.nuxt' \
            --exclude '.output' \
            --exclude 'dist' \
            --exclude '*.log' \
            docker-compose.yml nginx.conf nginx.http.conf nginx.host.conf certbot front tg_bot scripts .env deploy/

      - name: Verify deploy bundle permissions
        run: |
          test -s deploy/.env
          test -r deploy/.env
          tar -cf /dev/null deploy

      - name: Download Docker base images for server build
        run: |
          set -euo pipefail

          images=(
            "node:20-alpine"
            "node:18-alpine"
            "nginx:stable-alpine"
            "certbot/certbot:latest"
          )

          for image in "${images[@]}"; do
            docker pull "$image"
          done

          docker image save "${images[@]}" | gzip -1 > deploy/docker-base-images.tar.gz
          ls -lh deploy/docker-base-images.tar.gz

      - name: Prepare app directory on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          timeout: 120s
          command_timeout: 10m
          script: |
            mkdir -p /home/${{ secrets.SERVER_USER }}/app
            sudo chown -R ${{ secrets.SERVER_USER }}:${{ secrets.SERVER_USER }} /home/${{ secrets.SERVER_USER }}/app

      - name: Copy deploy bundle to server
        # Reuse existing files via rsync over OpenSSH instead of resending the
        # whole bundle. The uploader verifies its archive fallback if needed.
        timeout-minutes: 10
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          timeout --kill-after=15s 8m bash scripts/upload-deploy.sh deploy

      - name: Build and replace services on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          timeout: 120s
          command_timeout: 30m
          script_stop: true
          script: |
            set -euo pipefail
            cd /home/${{ secrets.SERVER_USER }}/app
            bash scripts/deploy.sh
            sudo docker exec tg_bot npm run check:mail -- dgu ups
