server {
	listen 5173;
	root /usr/share/nginx/html;

	# Compress text responses here so every reverse-proxy setup benefits.
	gzip on;
	gzip_vary on;
	gzip_proxied any;
	gzip_comp_level 5;
	gzip_min_length 1024;
	gzip_types text/plain text/css text/javascript application/javascript application/json application/manifest+json application/xml image/svg+xml;

	# HTML, payloads and unversioned scripts must see the latest deployment.
	add_header Cache-Control "no-cache";

	# The container is published through the HTTPS reverse proxy. Keep any
	# nginx-generated redirects relative so the internal http://:5173 address
	# never leaks to visitors.
	absolute_redirect off;
	port_in_redirect off;

	# The generated HTML redirect drops advertising query parameters. Redirect
	# here instead so call tracking receives the original UTM tags and click IDs.
	location = /hdd {
		return 301 /services/hdd$is_args$args;
	}
	location = /hdd/ {
		return 301 /services/hdd$is_args$args;
	}

	# The current site does not use PHP. Return "Gone" for legacy and malformed
	# PHP URLs so search engines remove them from their indexes.
	location ~* \.php(?:/|$) {
		return 410;
	}

	# Nuxt fingerprints build assets. Its builds/ metadata is not immutable
	# (including builds/latest.json), so it keeps the default revalidation.
	location ~ ^/_nuxt/(?!builds/) {
		add_header Cache-Control "public, max-age=31536000, immutable";
		try_files $uri =404;
	}

	# Change an image's URL when replacing it before this lifetime expires.
	location ~* \.(?:avif|webp|png|jpe?g|gif|svg|ico|woff2?|ttf|otf)$ {
		add_header Cache-Control "public, max-age=2592000";
		try_files $uri =404;
	}

	location / {
		index index.html index.htm;
		# Check a prerendered route's index before the directory itself. If nginx
		# matches the directory first, it redirects /privacy to /privacy/ using
		# the container's internal scheme and port.
		# Every public route is prerendered during the build. Unknown URLs must
		# return a real 404 instead of the home page (a search-engine "soft 404").
		try_files $uri/index.html $uri =404;
	}
	include /etc/nginx/extra-conf.d/*.conf;
}
